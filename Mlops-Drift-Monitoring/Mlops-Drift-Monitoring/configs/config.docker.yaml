# Live-demo configuration for docker-compose: time windows are minutes, not weeks,
# so drift can be observed in real time with the traffic generator.
data:
  n_train: 10000
  seed: 42

training:
  experiment_name: churn-prediction
  registered_model_name: churn-classifier
  cv_folds: 3
  candidates:
    - name: logistic_regression
      params: {C: 1.0, max_iter: 1000}
    - name: hist_gradient_boosting
      params: {max_iter: 100, learning_rate: 0.1, max_depth: 4}

monitoring:
  window_hours: 0.25          # 15 minutes
  min_samples: 300
  performance:
    min_labeled_samples: 150
  retrain:
    enabled: true
    cooldown_hours: 0.4
    lookback_hours: 1.0
    min_labeled_samples: 600
    history_rows: 500

serving:
  model_refresh_seconds: 10
