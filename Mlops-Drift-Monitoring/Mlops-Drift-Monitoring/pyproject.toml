[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mlops-drift-monitoring"
version = "1.0.0"
description = "End-to-end MLOps pipeline: training, model registry, serving, continuous drift monitoring and automated retraining."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1,<3",
  "scipy>=1.11",
  "scikit-learn>=1.4",
  "pyarrow>=14",
  "pyyaml>=6",
  "pydantic>=2.5",
  "matplotlib>=3.8",
  "mlflow>=2.16,<3",
  "sqlalchemy>=2.0,<2.1",   # MLflow 2.x is incompatible with SQLAlchemy 2.1
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "prometheus-client>=0.20",
  "httpx>=0.26",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.4"]

[project.scripts]
mlops = "mlops_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -W ignore::DeprecationWarning -W ignore::FutureWarning -W ignore::UserWarning"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008", "B905", "UP007", "UP045"]
